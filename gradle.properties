gradle.properties
# Gradle settings configured to optimize performance
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false

# Suppress warning about compileSdk 35 with Gradle Plugin 8.4.0
android.suppressUnsupportedCompileSdk=35

# Cache optimization - éviter les téléchargements redondants
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Utiliser le cache local plus agressivement
org.gradle.caching.debug=false

# Configuration réseau pour éviter les timeouts
systemProp.http.socketTimeout=60000
systemProp.http.connectionTimeout=60000
systemProp.https.socketTimeout=60000
systemProp.https.connectionTimeout=60000

# Empêcher la désinstallation automatique de l'app après les tests instrumentés
# (comportement par défaut de connectedDebugAndroidTest)
android.injected.androidTest.leaveApksInstalledAfterRun=true