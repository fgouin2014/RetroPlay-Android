<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSX Test - Resident Evil Survivor</title>
    <style>
        body { margin: 0; padding: 0; background: #000; }
        #game { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="game"></div>
    
    <script>
        const serverIP = window.location.hostname;
        
        // Forcer le schéma de contrôle PSX (vider l'ancien)
        localStorage.removeItem('EJS-controlScheme');
        localStorage.removeItem('EJS-settings');
        
        // Configuration EmulatorJS (minimum requis)
        window.EJS_player = "#game";
        window.EJS_gameUrl = `http://${serverIP}:8888/gamedata/psx/Resident Evil 1.5.PBP`;
        window.EJS_core = "pcsx_rearmed";
        window.EJS_pathtodata = `http://${serverIP}:8888/gamedata/data/`;
        window.EJS_biosUrl = `http://${serverIP}:8888/gamedata/data/bios/scph5501.bin`;
        window.EJS_skipBios = false;  // Afficher l'animation du BIOS PlayStation
        
        // Définir les contrôles virtuels PSX
        window.EJS_VirtualGamepadSettings = {
            enabled: true,
            opacity: 0.8,
            size: 1.0,
            scheme: 'psx'  // Schéma PSX
        };
        
        // Charger le script de contrôles PSX
        document.write(`<script src="https://www.lemon-web.net/includes/psxcontrol.js"><\/script>`);
        
        // Charger loader.js
        document.write(`<script src="http://${serverIP}:8888/gamedata/data/loader.js"><\/script>`);
    </script>
</body>
</html>
